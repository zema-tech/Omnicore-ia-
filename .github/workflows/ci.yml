name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: omnicore/package-lock.json
      - working-directory: omnicore
        run: npm ci
      - working-directory: omnicore
        run: npm run typecheck
      - working-directory: omnicore
        run: npm test
      - run: node --check omnicore/vscode-extension/extension.js
