<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnicore — dashboard</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --ko:#f85149; --code:#a5d6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:200px 1fr 1fr; gap:1px; background:var(--line); min-height:calc(100vh - 53px); }
  section { background:var(--bg); padding:12px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  #sessions button { display:block; width:100%; text-align:left; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:0 0 6px; cursor:pointer; }
  #sessions button.active { border-color:var(--acc); }
  #sessions small { color:var(--dim); display:block; }
  .msg { border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 0 8px; background:var(--panel); }
  .msg .t { font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.ko { color:var(--ko); border-color:var(--ko); }
  .steps { font-size:12px; color:var(--dim); margin-top:4px; white-space:pre-wrap; font-family:ui-monospace,monospace; }
  .timeline { background:#0a0e14; border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.45 ui-monospace,monospace; color:var(--code); white-space:pre-wrap; min-height:120px; }
  .live { border-color:var(--acc); }
  form.row { display:flex; gap:8px; margin-top:8px; }
  input[type=text], input[type=password] { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  button.send { background:var(--acc); color:#04121f; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer; }
  #settings { display:none; border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; font-size:12px; }
  #settings.open { display:block; }
  .bar { height:8px; background:var(--panel); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; background:var(--acc); }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Omnicore</h1>
  <span class="sub">chat live · loop ReAct · sessioni</span>
  <input type="password" id="token" placeholder="Bearer token" autocomplete="off" style="margin-left:auto;max-width:180px">
  <button class="ghost" id="cfgbtn">⚙ stato</button>
</header>
<main>
  <section>
    <h2>Sessioni</h2>
    <div id="sessions"></div>
    <button class="send" id="new" style="width:100%">+ nuova</button>
    <div id="settings"><div id="statusbox">…</div><button class="ghost" id="refresh" style="margin-top:8px">aggiorna</button></div>
  </section>
  <section>
    <h2>Chat</h2>
    <div id="chat"></div>
    <form class="row" id="chatform">
      <input type="text" id="text" placeholder="es. crea hello.txt con ciao · o: confermo: …" autocomplete="off">
      <button class="send">►</button>
    </form>
  </section>
  <section>
    <h2>Loop ReAct · live</h2>
    <div class="timeline" id="codetimeline">I tool del turno compaiono qui in diretta.</div>
    <form class="row" id="codeform">
      <input type="text" id="codegoal" placeholder="goal coding…">
      <button class="send">code.task</button>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let sid = null;
try { $('token').value = localStorage.getItem('omnicore_token') || ''; } catch {}
$('token').onchange = () => { try { localStorage.setItem('omnicore_token', $('token').value); } catch {} };
$('cfgbtn').onclick = () => { $('settings').classList.toggle('open'); loadStatus(); };
function auth() {
  const h = {'Content-Type': 'application/json'};
  if ($('token').value) h['Authorization'] = 'Bearer ' + $('token').value;
  return h;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: auth()} : {method:'POST', headers: auth(), body:JSON.stringify(body)});
  return r.json();
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function msgHtml(m, answer) {
  const cls = m.ok === true ? 'ok' : (m.ok === false ? 'ko' : '');
  const ans = answer ? `<div style="margin-top:6px;white-space:pre-wrap;border-left:2px solid var(--acc);padding-left:8px">${escapeHtml(answer)}</div>` : '';
  return `<div class="msg"><span class="badge">${m.intent||'chat'}</span> <span class="badge ${cls}">${m.ok===undefined?'':(m.ok?'ok':'ko')}</span>${ans}<div class="steps">${escapeHtml(m.summary||'')}</div></div>`;
}
async function loadSessions() {
  const list = await api('/api/sessions');
  $('sessions').innerHTML = (list||[]).map(s =>
    `<button data-id="${s.id}" class="${s.id===sid?'active':''}"><b>${s.id}</b> <small>${s.count} msg · ${(s.last||'').slice(0,40)}</small></button>`).join('') || '<small style="color:var(--dim)">nessuna sessione</small>';
  document.querySelectorAll('#sessions button[data-id]').forEach(b => b.onclick = () => { sid = b.dataset.id; loadChat(); loadSessions(); });
}
async function loadChat() {
  if (!sid) { $('chat').innerHTML = '<small style="color:var(--dim)">scegli o crea una sessione</small>'; return; }
  const s = await api('/api/session?id=' + encodeURIComponent(sid));
  $('chat').innerHTML = (s.messages||[]).map(m => msgHtml(m, m.answer)).join('');
  $('chat').scrollTop = $('chat').scrollHeight;
}
async function loadStatus() {
  try {
    const [doc, st] = await Promise.all([api('/api/doctor'), api('/api/status')]);
    const b = st.budget || {};
    const pct = b.pct == null ? 'illimitato' : Math.round(b.pct*100) + '%';
    $('statusbox').innerHTML =
      `cervello: <b>${escapeHtml(doc.active || st.brain || '?')}</b><br>` +
      `token oggi: <b>${b.used||0}</b>${b.limit?` / ${b.limit}`:''} (${pct}) · chiamate: ${b.calls||0}` +
      `<div class="bar"><div style="width:${b.pct==null?0:Math.min(100,Math.round(b.pct*100))}%"></div></div>` +
      `<small style="color:var(--dim)">key e segreti restano env sul server, mai qui.</small>`;
  } catch { $('statusbox').textContent = 'stato non raggiungibile'; }
}
$('refresh').onclick = loadStatus;
function toolLine(e) {
  if (e.event === 'tool_start') return `… ${e.name} …\n`;
  if (e.event === 'tool_end') return `… ${e.name} ${e.ok ? 'ok' : 'KO'}\n`;
  if (e.event === 'loop_end') return `[giri ${e.rounds}, ${e.planner}]\n`;
  return '';
}
async function sendStream(text) {
  const r = await fetch('/api/chat/stream', {method:'POST', headers: auth(), body:JSON.stringify({text, session_id: sid})});
  if (!r.ok || !r.body) { await sendAgent(text); return; }
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '', answer = '', tools = '';
  const live = document.createElement('div');
  live.className = 'msg live';
  live.innerHTML = '<span class="badge">live</span><div class="ans" style="white-space:pre-wrap"></div>';
  $('chat').appendChild(live);
  const ansEl = live.querySelector('.ans');
  $('codetimeline').textContent = '';
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const p of parts) {
      const line = p.trim();
      if (line.startsWith(':')) {
        const m = line.match(/^:\s*session\s+(\S+)/);
        if (m) sid = m[1];
        continue;
      }
      if (!line.startsWith('data:')) continue;
      let e;
      try { e = JSON.parse(line.slice(5).trim()); } catch { continue; }
      if (e.event === 'token') { answer += e.text || ''; ansEl.textContent = answer; }
      else if (e.event === 'result') { answer = e.reply || answer; ansEl.textContent = answer; }
      else { const t = toolLine(e); if (t) { tools += t; $('codetimeline').textContent = tools; } }
    }
    $('chat').scrollTop = $('chat').scrollHeight;
  }
  live.classList.remove('live');
  await loadSessions(); await loadChat();
}
async function sendAgent(text) {
  const res = await api('/api/chat', {text, session_id: sid});
  sid = res.session_id || sid;
  await loadSessions(); await loadChat();
  return res;
}
$('chatform').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim(); if (!text) return;
  $('text').value = '';
  await sendStream(text);
};
$('codeform').onsubmit = async e => {
  e.preventDefault();
  const goal = $('codegoal').value.trim(); if (!goal) return;
  $('codegoal').value = '';
  const text = /^conferm/i.test(goal) ? goal : ('confermo: ' + goal);
  $('codetimeline').textContent = '… code.task in corso';
  await sendStream(text);
};
$('new').onclick = () => { sid = null; $('chat').innerHTML = '<small style="color:var(--dim)">primo messaggio crea la sessione</small>'; loadSessions(); };
loadSessions();
</script>
</body>
</html>
