<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnicore — dashboard unica</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --ko:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:220px 1fr 1fr; gap:1px; background:var(--line); min-height:calc(100vh - 53px); }
  section { background:var(--bg); padding:12px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  #sessions button { display:block; width:100%; text-align:left; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:0 0 6px; cursor:pointer; }
  #sessions button.active { border-color:var(--acc); }
  #sessions small { color:var(--dim); display:block; }
  .msg { border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 0 8px; background:var(--panel); }
  .msg .t { font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.ko { color:var(--ko); border-color:var(--ko); }
  .steps { font-size:12px; color:var(--dim); margin-top:4px; }
  form.row { display:flex; gap:8px; margin-top:8px; }
  input[type=text], textarea { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  textarea { width:100%; min-height:160px; font-family:monospace; font-size:12px; }
  button.send { background:var(--acc); color:#04121f; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-weight:600; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; font-size:12px; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>Omnicore</h1><span class="sub">una dashboard · una API · sessioni uniche</span><input type="password" id="token" placeholder="Bearer token" autocomplete="off" style="margin-left:auto;max-width:180px"></header>
<main>
  <section>
    <h2>Sessioni</h2>
    <div id="sessions"></div>
    <button class="send" id="new" style="width:100%">+ nuova</button>
  </section>
  <section>
    <h2>Chat (agent loop unico)</h2>
    <div id="chat"></div>
    <form class="row" id="chatform"><input type="text" id="text" placeholder="scrivi… (es. fix login bug)" autocomplete="off"><button class="send">►</button></form>
  </section>
  <section>
    <h2>OmniLang (.omni)</h2>
    <textarea id="omnisrc" spellcheck="false">system hermes: memory via "bridge"

tool recall on hermes:
  call "conversations_list"
  args search = $query, limit = 5

flow "demo" when intent == "chat":
  ctx = recall(search: $text)</textarea>
    <form class="row"><input type="text" id="omnitext" value="ciao"><button class="send" id="omnirun">esegui</button></form>
    <pre id="omniout">—</pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let sid = null;
try { $('token').value = localStorage.getItem('omnicore_token') || ''; } catch {}
$('token').onchange = () => { try { localStorage.setItem('omnicore_token', $('token').value); } catch {} };
async function api(path, body) {
  const headers = {'Content-Type': 'application/json'};
  if ($('token').value) headers['Authorization'] = 'Bearer ' + $('token').value;
  const r = await fetch(path, body === undefined ? {headers} : {method:'POST', headers, body:JSON.stringify(body)});
  return r.json();
}
function msgHtml(m) {
  const cls = m.ok === true ? 'ok' : (m.ok === false ? 'ko' : '');
  const ans = m.answer ? `<div style="margin-top:6px;color:var(--txt);white-space:pre-wrap;border-left:2px solid var(--acc);padding-left:8px">${escapeHtml(m.answer)}</div>` : '';
  return `<div class="msg"><span class="t"></span><span class="badge">${m.intent||''} · ${m.handler||''}</span> <span class="badge ${cls}">${m.ok===undefined?'':(m.ok?'ok':'ko')}</span><div></div>${ans}<div class="steps">${m.summary||''}</div></div>`;
}
async function loadSessions() {
  const list = await api('/api/sessions');
  $('sessions').innerHTML = list.map(s =>
    `<button data-id="${s.id}" class="${s.id===sid?'active':''}"><b>${s.id}</b> <small>${s.count} msg · ${(s.last||'').slice(0,40)}</small></button>`).join('') || '<small style="color:var(--dim)">nessuna sessione</small>';
  document.querySelectorAll('#sessions button[data-id]').forEach(b => b.onclick = () => { sid = b.dataset.id; loadChat(); loadSessions(); });
}
async function loadChat() {
  if (!sid) { $('chat').innerHTML = '<small style="color:var(--dim)">scegli o crea una sessione</small>'; return; }
  const s = await api('/api/session?id=' + encodeURIComponent(sid));
  $('chat').innerHTML = (s.messages||[]).map(m => msgHtml(m).replace('<span class="t"></span>', `<span class="t"></span>${escapeHtml(m.text)}`)).join('');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
$('chatform').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim(); if (!text) return;
  $('text').value = '';
  const res = await api('/api/chat', {text, session_id: sid});
  sid = res.session_id;
  await loadSessions(); await loadChat();
};
$('new').onclick = () => { sid = null; $('chat').innerHTML = '<small style="color:var(--dim)">scrivi il primo messaggio: la sessione nasce da sola</small>'; loadSessions(); };
$('omnirun').onclick = async e => {
  e.preventDefault();
  $('omniout').textContent = '…';
  const res = await api('/api/omni', {source: $('omnisrc').value, text: $('omnitext').value || 'ciao'});
  $('omniout').textContent = JSON.stringify(res, null, 2);
};
loadSessions();
</script>
</body>
</html>
