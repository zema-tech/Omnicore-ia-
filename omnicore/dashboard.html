<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnicore — dashboard</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --ko:#f85149; --code:#a5d6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:200px 1fr 1fr; gap:1px; background:var(--line); min-height:calc(100vh - 53px); }
  section { background:var(--bg); padding:12px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  #sessions button { display:block; width:100%; text-align:left; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:0 0 6px; cursor:pointer; }
  #sessions button.active { border-color:var(--acc); }
  #sessions small { color:var(--dim); display:block; }
  .msg { border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 0 8px; background:var(--panel); }
  .msg .t { font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.ko { color:var(--ko); border-color:var(--ko); }
  .steps { font-size:12px; color:var(--dim); margin-top:4px; white-space:pre-wrap; font-family:ui-monospace,monospace; }
  .timeline { background:#0a0e14; border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.45 ui-monospace,monospace; color:var(--code); white-space:pre-wrap; min-height:120px; }
  form.row { display:flex; gap:8px; margin-top:8px; }
  input[type=text], textarea { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  button.send { background:var(--acc); color:#04121f; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-weight:600; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Omnicore</h1>
  <span class="sub">chat · code.task (Claude Code) · sessioni</span>
  <input type="password" id="token" placeholder="Bearer token" autocomplete="off" style="margin-left:auto;max-width:180px">
</header>
<main>
  <section>
    <h2>Sessioni</h2>
    <div id="sessions"></div>
    <button class="send" id="new" style="width:100%">+ nuova</button>
  </section>
  <section>
    <h2>Chat</h2>
    <div id="chat"></div>
    <form class="row" id="chatform">
      <input type="text" id="text" placeholder="es. crea hello.txt con ciao · o: confermo: …" autocomplete="off">
      <button class="send">►</button>
    </form>
  </section>
  <section>
    <h2>Code agent · timeline</h2>
    <p style="color:var(--dim);font-size:12px;margin:0 0 8px">Come Claude Code: plan → step → file toccati. Usa <code>confermo:</code> per eseguire.</p>
    <div class="timeline" id="codetimeline">Nessun code.task ancora.
Prova: «confermo: crea note.md con hello»</div>
    <form class="row" id="codeform">
      <input type="text" id="codegoal" placeholder="goal coding…">
      <button class="send">code.task</button>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let sid = null;
try { $('token').value = localStorage.getItem('omnicore_token') || ''; } catch {}
$('token').onchange = () => { try { localStorage.setItem('omnicore_token', $('token').value); } catch {} };
async function api(path, body) {
  const headers = {'Content-Type': 'application/json'};
  if ($('token').value) headers['Authorization'] = 'Bearer ' + $('token').value;
  const r = await fetch(path, body === undefined ? {headers} : {method:'POST', headers, body:JSON.stringify(body)});
  return r.json();
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function extractTimeline(res) {
  // cerca steps/timeline nella risposta agent
  const t = res?.trace || res?.tools || res?.result?.trace || [];
  const arr = Array.isArray(t) ? t : [];
  for (const step of arr) {
    if (step?.name === 'code.task' && step?.data?.timeline) return step.data.timeline;
    if (step?.data?.steps) {
      return (step.data.summary || '') + '\n' + step.data.steps.map((s,i) =>
        `${i+1}. ${s.ok===false?'✗':'✓'} ${s.kind}${s.path?' '+s.path:''}${s.cmd?' `'+s.cmd+'`':''}`
      ).join('\n');
    }
  }
  if (res?.reply && /code\(agent|code\.task|File:/.test(res.reply)) return res.reply;
  return null;
}
function msgHtml(m) {
  const cls = m.ok === true ? 'ok' : (m.ok === false ? 'ko' : '');
  const ans = m.answer ? `<div style="margin-top:6px;white-space:pre-wrap;border-left:2px solid var(--acc);padding-left:8px">${escapeHtml(m.answer)}</div>` : '';
  return `<div class="msg"><span class="t"></span><span class="badge">${m.intent||''}</span> <span class="badge ${cls}">${m.ok===undefined?'':(m.ok?'ok':'ko')}</span><div></div>${ans}<div class="steps">${escapeHtml(m.summary||'')}</div></div>`;
}
async function loadSessions() {
  const list = await api('/api/sessions');
  $('sessions').innerHTML = (list||[]).map(s =>
    `<button data-id="${s.id}" class="${s.id===sid?'active':''}"><b>${s.id}</b> <small>${s.count} msg · ${(s.last||'').slice(0,40)}</small></button>`).join('') || '<small style="color:var(--dim)">nessuna sessione</small>';
  document.querySelectorAll('#sessions button[data-id]').forEach(b => b.onclick = () => { sid = b.dataset.id; loadChat(); loadSessions(); });
}
async function loadChat() {
  if (!sid) { $('chat').innerHTML = '<small style="color:var(--dim)">scegli o crea una sessione</small>'; return; }
  const s = await api('/api/session?id=' + encodeURIComponent(sid));
  $('chat').innerHTML = (s.messages||[]).map(m => msgHtml(m).replace('<span class="t"></span>', `<span class="t"></span>${escapeHtml(m.text)}`)).join('');
}
async function sendAgent(text) {
  const res = await api('/api/chat', {text, session_id: sid});
  sid = res.session_id || sid;
  const tl = extractTimeline(res);
  if (tl) $('codetimeline').textContent = tl;
  else if (res.reply) $('codetimeline').textContent = res.reply;
  await loadSessions(); await loadChat();
  return res;
}
$('chatform').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim(); if (!text) return;
  $('text').value = '';
  await sendAgent(text);
};
$('codeform').onsubmit = async e => {
  e.preventDefault();
  const goal = $('codegoal').value.trim(); if (!goal) return;
  $('codegoal').value = '';
  $('codetimeline').textContent = '… code.task in corso';
  const text = /^conferm/i.test(goal) ? goal : ('confermo: ' + goal);
  await sendAgent(text);
};
$('new').onclick = () => { sid = null; $('chat').innerHTML = '<small style="color:var(--dim)">primo messaggio crea la sessione</small>'; loadSessions(); };
loadSessions();
</script>
</body>
</html>
